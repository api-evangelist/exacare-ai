aid: exacare-ai
name: ExaCare AI
description: 'ExaCare AI is a post-acute and senior care operations platform that applies AI to admissions,
  referral management, prior authorization, and reimbursement workflows across skilled nursing, home health,
  hospice, and assisted living providers. It reads inbound referral and admissions packets, extracts clinical
  and payer data, and automates the back-office work of accepting and reimbursing patients, with integrations
  into referral platforms, hospital systems, and EHRs. ExaCare is a private company backed by Insight Partners;
  it ships a customer web application and a Vanta-hosted Trust Center (HIPAA) but publishes no public developer
  API at this time.'
